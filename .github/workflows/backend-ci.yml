name: Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flashlearn_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run backend unit tests
        run: npm test

      - name: Print SM-2 algorithm test table
        run: npm run test:sm2-table

      - name: Print Retention Rate test table
        run: npm run test:retention-table

      - name: Build backend
        run: npm run build
